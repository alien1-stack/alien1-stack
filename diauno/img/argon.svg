<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" role="img"><title>Argón, El Juez: alienígena verde esmeralda con visor dorado tipo búho y un cronómetro</title><defs>
  <radialGradient id="g-body" cx="38%" cy="28%" r="80%">
    <stop offset="0" stop-color="#3FC48E"/><stop offset=".55" stop-color="#159A69"/><stop offset="1" stop-color="#0C6B49"/>
  </radialGradient>
  <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFD978"/><stop offset="1" stop-color="#D49A22"/>
  </linearGradient>
  <radialGradient id="g-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#6FF2BC" stop-opacity=".85"/><stop offset="1" stop-color="#6FF2BC" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="argon">
  <ellipse cx="200" cy="398" rx="104" ry="12" fill="#000" opacity=".12"/>
  <ellipse cx="200" cy="380" rx="70" ry="13" fill="url(#g-glow)"/>
